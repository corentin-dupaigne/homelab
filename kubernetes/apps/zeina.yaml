apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zeina
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # The chart is served straight from the application repo: no packaged
    # chart is published, and its CI records each release (a vX.Y.Z git
    # tag) in the chart on main. Nothing writes back to this repo.
    - repoURL: https://github.com/corentin-dupaigne/zeina
      targetRevision: main
      path: helm/zeina
      helm:
        values: |
          hostname: "girlfriend.corentindupaigne.com"
          gateway:
            name: default-gateway
            namespace: kube-system
  destination:
    server: https://kubernetes.default.svc
    namespace: zeina
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
