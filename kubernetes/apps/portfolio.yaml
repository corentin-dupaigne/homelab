apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # The chart is served straight from the application repo: no packaged
    # chart is published, and the deployed image tag is recorded in that
    # repo's values.yaml by its CI. Nothing writes back to this repo.
    - repoURL: https://github.com/corentin-dupaigne/portfolio_v2
      targetRevision: main
      path: helm/portfolio
      helm:
        values: |
          hostname: "corentindupaigne.com"
          gateway:
            name: default-gateway
            namespace: kube-system
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
