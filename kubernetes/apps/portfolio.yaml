apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/corentin-dupaigne/portfolio-v2
      chart: portfolio
      targetRevision: 0.1.0
      helm:
        values: |
          hostname: "corentindupaigne.com"
          gateway:
            name: default-gateway
            namespace: kube-system
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
