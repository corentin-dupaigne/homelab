apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pomopensource
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # The chart is served straight from the application repo: no packaged
    # chart is published, and its CI records each release (a vX.Y.Z git
    # tag) in the chart on master. Nothing writes back to this repo.
    - repoURL: https://github.com/corentin-dupaigne/pomopensource
      targetRevision: master
      path: pomopensource
      helm:
        values: |
          gateway:
            name: default-gateway
            namespace: kube-system
          app:
            existingSecret: pomopensource-secrets
          mysql:
            auth:
              existingSecret: pomopensource-secrets
            image:
              repository: bitnamilegacy/mysql
    - repoURL: https://github.com/corentin-dupaigne/homelab
      targetRevision: main
      path: kubernetes/manifests/workloads/pomopensource
  destination:
    server: https://kubernetes.default.svc
    namespace: pomopensource
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
