# Accounts, retention, focus time, and Discord calls and servers of
# pomopensource, read from its MySQL database through the read-only grafana
# account (see the
# grafana-datasource-pomopensource datasource, and the Job that creates the
# account in kubernetes/manifests/workloads/pomopensource).
# Picked up by the Grafana dashboard sidecar through the grafana_dashboard label.
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: pomopensource-dashboard
  namespace: monitoring
data:
  pomopensource.json: |
