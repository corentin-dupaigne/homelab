              "rawSql": "SELECT signup AS \"signup day\", COUNT(id) AS accounts, CASE WHEN signup <= UTC_DATE() - INTERVAL 1 DAY THEN 100 * AVG(COALESCE(focused, 0)) END AS \"focused that day\", CASE WHEN signup <= UTC_DATE() - INTERVAL 2 DAY THEN 100 * AVG(COALESCE(day1, 0)) END AS \"next day\", CASE WHEN signup <= UTC_DATE() - INTERVAL 4 DAY THEN 100 * AVG(COALESCE(day3, 0)) END AS \"3+ days\", CASE WHEN signup <= UTC_DATE() - INTERVAL 8 DAY THEN 100 * AVG(COALESCE(day7, 0)) END AS \"7+ days\" FROM (SELECT u.id, DATE(u.created_at) AS signup, MAX(DATEDIFF(f.started_at, u.created_at) = 0 AND f.minute_focused > 0) AS focused, MAX(DATEDIFF(f.started_at, u.created_at) = 1) AS day1, MAX(DATEDIFF(f.started_at, u.created_at) >= 3) AS day3, MAX(DATEDIFF(f.started_at, u.created_at) >= 7) AS day7 FROM users u LEFT JOIN focused_sessions f ON f.user_id = u.id AND f.started_at >= '2026-10-08' AND f.started_at <= UTC_TIMESTAMP() + INTERVAL 5 MINUTE WHERE $__timeFilter(u.created_at) AND u.created_at >= '2026-10-08' GROUP BY u.id, signup) AS cohorts GROUP BY signup ORDER BY signup DESC"
            }
          ],
