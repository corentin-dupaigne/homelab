---
- name: Create k3s config directory
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# Written before the install so a fresh host never starts with flannel.
- name: Write k3s config
  template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: Install k3s
  shell: curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s

# Leftover from a flannel-era install; it would otherwise keep being picked
# up by containerd.
- name: Remove flannel CNI config
  file:
    path: /var/lib/rancher/k3s/agent/etc/cni/net.d/10-flannel.conflist
    state: absent

- name: Apply k3s config changes
  meta: flush_handlers

# Still up after a flannel-era install, and cni0 holds 10.42.0.1, the address
# tiny-cni's bridge needs.
- name: Remove flannel interfaces
  shell: |
    for link in cni0 flannel.1; do
      if ip link show "$link" >/dev/null 2>&1; then
        ip link delete "$link" && echo "deleted $link"
      fi
    done
  register: flannel_links
  changed_when: flannel_links.stdout != ""

- name: Create CNI binary directory
  file:
    path: /opt/cni/bin
    state: directory
    mode: "0755"

# containerd sets up every pod's lo with the loopback plugin. Without flannel,
# k3s points containerd at /opt/cni/bin, where nothing provides it; k3s's own
# copy is kept current across upgrades under data/cni.
- name: Link k3s loopback plugin into /opt/cni/bin
  file:
    src: /var/lib/rancher/k3s/data/cni/loopback
    dest: /opt/cni/bin/loopback
    state: link

- name: Copy tiny-cni manifests
  copy:
    src: "{{ playbook_dir }}/../kubernetes/manifests/infra/tiny-cni/"
    dest: /etc/rancher/k3s/tiny-cni/
    mode: "0600"

# Nothing else gets a pod IP until this is in place, including Argo CD, which
# adopts these same manifests once it is running.
- name: Install tiny-cni
  command: kubectl apply -f /etc/rancher/k3s/tiny-cni/
  register: tiny_cni_apply
  changed_when: "'configured' in tiny_cni_apply.stdout or 'created' in tiny_cni_apply.stdout"
  # The API server may still be starting right after install or restart.
  retries: 12
  delay: 5
  until: tiny_cni_apply is succeeded

- name: Wait for tiny-cni to be rolled out
  command: kubectl rollout status daemonset/tiny-cni -n kube-system --timeout=180s
  changed_when: false

- name: Install helm
  shell: curl -sfL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Install Envoy Gateway
  shell: helm upgrade --install eg oci://docker.io/envoyproxy/gateway-helm --version v1.7.2 -n envoy-gateway-system --create-namespace
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for Envoy Gateway to be available
  shell: kubectl wait --timeout=5m -n envoy-gateway-system deployment/envoy-gateway --for=condition=Available
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
